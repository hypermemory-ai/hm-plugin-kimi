[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypercolab"
version = "0.1.0"
description = "Project-scoped coordination, graph memory, and development timelines for AI coding teams."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "HyperMemory AI", email = "hello@runstack.ai" }]
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "mcp[cli]>=1.2,<2",
    "rich>=13,<14",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
hypercolab = "hypercolab_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["hypercolab_cli"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
