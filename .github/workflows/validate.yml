name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install ruff pytest
      - name: Manifest at plugin root
        run: test -f kimi.plugin.json
      - name: Lint
        run: ruff check scripts tests
      - name: Test
        run: pytest -q
      - name: Build review archive
        run: python scripts/build_plugin_archives.py
