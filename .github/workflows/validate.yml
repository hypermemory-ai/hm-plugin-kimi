name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e "packages/hypercolab-cli[dev]"
      - name: Lint
        run: ruff check plugins packages tests scripts
      - name: Test
        run: pytest -q
      - name: Build review archives
        run: python scripts/build_plugin_archives.py
