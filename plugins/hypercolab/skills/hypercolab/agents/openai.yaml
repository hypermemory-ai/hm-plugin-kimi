interface:
  display_name: "HyperColab"
  short_description: "Coordinate coding work across one repository"
  default_prompt: "Use $hypercolab to join this project, sync active work, and claim the files needed for my task."

dependencies:
  tools:
    - type: "mcp"
      value: "hypercolab"
      description: "Local project-aware HyperColab MCP shim"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
